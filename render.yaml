databases:
  - name: health-ai-db
    databaseName: health_ai
    user: health_ai_app
    plan: free
    region: singapore

services:
  - type: web
    name: health-ai-research
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    preDeployCommand: python -m alembic upgrade head
    healthCheckPath: /api/v1/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: health-ai-db
          property: connectionString
