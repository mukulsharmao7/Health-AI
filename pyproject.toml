[project]
name = "health-ai"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19",
    "fastapi>=0.115",
    "joblib>=1.4",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
research = ["torch>=2.4"]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
