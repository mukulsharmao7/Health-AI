name: Health-AI CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install . pytest httpx
      - name: Run tests
        run: python -m pytest -p no:cacheprovider tests -q
      - name: Render migration SQL
        run: python -m alembic upgrade head --sql > migration-preview.sql
      - name: Build production container
        run: docker build --tag health-ai:ci .
